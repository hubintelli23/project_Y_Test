<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리들의 시간 · 공통 루트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;900&display=swap">
<style>
:root{--bg:#e9ecf1;--panel:rgba(250,251,253,.9);--ink:#1b2030;--mute:#5d6578;--line:#aab2c4;--acc:#b8456b;--s1:#d6dded;--s2:#f0dfe8;
--serif:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131b;--panel:rgba(22,26,38,.92);--ink:#e9e6ee;--mute:#9aa1b5;--line:#3a4155;--acc:#e8a3b8;--s1:#182033;--s2:#2b2030}}
:root[data-theme="dark"]{--bg:#10131b;--panel:rgba(22,26,38,.92);--ink:#e9e6ee;--mute:#9aa1b5;--line:#3a4155;--acc:#e8a3b8;--s1:#182033;--s2:#2b2030}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:3px;padding:.45em .9em;cursor:pointer}
button:hover{border-color:var(--acc)}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
#app{position:relative;height:100%;overflow:hidden;background:radial-gradient(circle at 78% 22%,var(--s2),transparent 46%),radial-gradient(circle at 18% 80%,var(--s2),transparent 38%),linear-gradient(160deg,var(--s1),var(--bg))}
.bg{position:absolute;inset:0;opacity:0;transition:opacity .7s;overflow:hidden}.bg.on{opacity:1}
.bg div{position:absolute;background-position:center;background-repeat:no-repeat}
.bg .bb{inset:-30px;background-size:cover;filter:blur(22px) brightness(.85)}
.bg .bi{inset:0;background-size:contain}
@media(max-aspect-ratio:17/25){.bg .bi{background-size:cover}}
.vf i{position:absolute;width:34px;height:34px;border:0 solid var(--acc);opacity:.7;pointer-events:none}
.vf i:nth-child(1){top:16px;left:16px;border-width:2px 0 0 2px}.vf i:nth-child(2){top:16px;right:16px;border-width:2px 2px 0 0}
.vf i:nth-child(3){bottom:16px;left:16px;border-width:0 0 2px 2px}.vf i:nth-child(4){bottom:16px;right:16px;border-width:0 2px 2px 0}
#chr{position:absolute;inset:0;pointer-events:none}
#chr img{position:absolute;bottom:0;left:var(--cx,56%);height:var(--ch,92%);max-width:96%;object-fit:contain;transform:translateX(-50%);opacity:0;transition:opacity .25s}
#chr img.on{opacity:1}
@media(max-aspect-ratio:17/25){#chr img{left:50%!important}}
#vol{width:200px;accent-color:var(--acc);vertical-align:middle}
#bSnd2{margin-top:6px}
#pick{background:rgba(8,10,18,.55)}
.pk{display:block;width:min(560px,92%);padding:1em 1.2em;font-family:var(--serif);font-size:clamp(1rem,2.6vw,1.15rem);background:var(--panel);border:2px solid var(--acc)}
.grid .wide{grid-column:1/-1;border-style:dashed;border-color:var(--acc);padding:1.2em .5em}
#soon h2{margin:0;font-family:var(--serif);font-size:clamp(1.3rem,4.5vw,2rem);font-weight:600;line-height:1.6;animation:f .6s}
#soon{cursor:pointer}#pskip{margin-top:14px}
#bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:30px 36px 0;font-size:.85rem;color:var(--mute)}
#bar nav{display:flex;gap:6px;flex-wrap:wrap}#bar button{font-size:.8rem;padding:.3em .7em}
#box{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:min(780px,calc(100% - 56px));min-height:150px;padding:30px 30px 24px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tc,var(--acc));cursor:pointer;backdrop-filter:blur(6px)}
#nm{position:absolute;top:-17px;left:18px;padding:3px 14px;background:var(--tc,var(--acc));color:#fff;font-size:.88rem;font-weight:700;border-radius:2px}
#tx{margin:0;font-family:var(--serif);font-size:clamp(1rem,2.4vw,1.15rem);line-height:1.95;word-break:keep-all;white-space:pre-wrap}
#box.nar #tx{color:var(--ink)}#box.dlg #tx{font-weight:600}
#box.msg{border-radius:14px;border-left-width:1px;border-left-color:var(--line)}#box.msg #tx{font-family:var(--sans);font-size:1rem}
#box.sys{text-align:center;border-left-width:1px}#box.sys #tx{color:var(--acc);font-weight:600}
#nx{position:absolute;right:16px;bottom:8px;color:var(--acc);animation:b 1.2s infinite}
@keyframes b{50%{transform:translateY(4px)}}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 24px;text-align:center;background:var(--bg)}
.ov[hidden],#box[hidden],#bar[hidden],#nx[hidden]{display:none}
#title{background:transparent}
#title h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(2.6rem,9vw,5rem);letter-spacing:.04em}
#title p,.ov .sub{margin:0;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{padding:.7em 2em}
#card{cursor:pointer}#card h2{margin:0;font-family:var(--serif);font-size:clamp(1.5rem,5vw,2.4rem);font-weight:600}
#card .k{color:var(--acc);font-size:.95rem}
#card{animation:f .5s}@keyframes f{from{opacity:0}}
#choice h2,#end h2{margin:0;font-family:var(--serif);font-size:clamp(1.3rem,4vw,1.9rem)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(720px,100%)}
.grid button{position:relative;padding:2.2em .5em;font-family:var(--serif);font-size:1.15rem;border-width:2px;background:var(--panel);border-left-color:var(--tc)}
.grid button:hover{border-color:var(--tc);transform:translateY(-2px)}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}#bar{padding:26px 22px 0}}
.list{width:min(560px,100%);max-height:52vh;overflow-y:auto;text-align:left;border:1px solid var(--line);background:var(--panel)}
.list h3{margin:0;padding:10px 14px;font-size:.85rem;color:var(--mute);border-bottom:1px solid var(--line)}
.list button{display:block;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left}
.log p{margin:0 0 10px}.log b{color:var(--acc);margin-right:.6em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <div class="bg" id="bgA"><div class="bb"></div><div class="bi"></div></div>
 <div class="bg" id="bgB"><div class="bb"></div><div class="bi"></div></div>
 <div class="vf"><i></i><i></i><i></i><i></i></div>
 <div id="chr"><img alt=""></div>
 <header id="bar" hidden><span id="lb"></span><nav><button id="bPSkip" hidden>공통 루트 건너뛰기</button><button id="bLog">로그</button><button id="bAuto" aria-pressed="false">자동</button><button id="bSkip" aria-pressed="false">스킵</button><button id="bSnd" aria-pressed="true">소리</button><button id="bMenu">메뉴</button></nav></header>
 <main id="box" hidden><div id="nm" hidden></div><p id="tx"></p><span id="nx" hidden>▾</span></main>

 <section id="title" class="ov">
  <h1>우리들의 시간</h1><p>메인 히로인 공통 루트 · 프롤로그부터 제5장까지</p>
  <div class="row"><button class="big" id="bNew">처음부터 시작</button><button class="big" id="bCont" hidden>이어하기</button></div>
  <button id="bSnd2">배경음 켜기</button>
 </section>
 <section id="card" class="ov" hidden><div class="k" id="ck"></div><h2 id="ct"></h2><div class="sub" id="cs"></div><button id="pskip" hidden>공통 루트 전체 건너뛰기</button></section>
 <section id="choice" class="ov" hidden><h2>메인 피사체를 선택하세요</h2><p class="sub">오늘 촬영한 여섯 사람 가운데 한 명을 고릅니다.</p><div class="grid" id="gr"></div></section>
 <section id="end" class="ov" hidden><h2 id="et"></h2><p class="sub" id="es"></p><div class="row"><button id="bAgain">다시 선택</button><button id="bHome">제목으로</button></div></section>
 <section id="pick" class="ov" hidden><div id="pk"></div></section>
 <section id="soon" class="ov" hidden><h2>지금은 제작 중입니다.<br>업데이트를 기다려 주세요.</h2></section>
 <section id="menu" class="ov" hidden><h2 style="margin:0;font-family:var(--serif)">메뉴</h2>
  <div class="row"><button id="bTheme">화면 테마 바꾸기</button><button id="bToTitle">제목으로</button><button id="bCloseM">닫기</button></div>
  <label class="sub">배경음 볼륨 <input id="vol" type="range" min="0" max="100" value="60"></label>
  <div class="list" id="toc"></div></section>
 <section id="log" class="ov" hidden><div class="list log" id="lg" style="padding:14px"></div><button id="bCloseL">닫기</button></section>
</div>

<script>
const STORY={"chars":["차성재","이현우","강지우","윤아린","한서윤","이세라","서하린","최유나","교수","학생","백시은","강채아","민경훈","손님","관람객"],"ch":[{"id":"prologue","number":0,"title":"첫 셔터, 흩날리는 봄의 경계","eps":[{"title":"벚꽃이 흩날리는 입학 첫날","nodes":[[0,-1,"사람의 눈은 수많은 장면을 담아낸다."],[0,-1,"누군가의 웃음, 스쳐 지나가는 풍경, 바람에 흔들리는 나뭇잎. 우리는 매 순간 무언가를 바라보며 살아가지만, 시간이 흐른 뒤에도 그때의 모든 모습을 온전히 기억하지는 못한다."],[0,-1,"분명히 보았던 장면인데도 세부적인 부분은 흐릿해지고, 잊고 싶지 않았던 순간조차 어느새 희미한 인상만 남는다. 때로는 실제로 일어났던 일보다 그 순간에 느꼈던 감정이 더 선명하게 기억되기도 한다."],[0,-1,"그래서 나는 카메라를 들었다."],[0,-1,"기록된 찰나는 거짓말을 하지 않으니까."],[0,-1,"적어도, 내 불안한 눈보다는."],[0,-1,"3월 2일."],[0,-1,"새 학기의 시작을 알리는 봄바람이 서운대학교 교정을 가로질렀다. 아직은 조금 쌀쌀한 공기 속에서 벚꽃잎이 흩날렸고, 입학 첫날을 맞이한 학생들은 저마다 새로운 하루를 보내고 있었다."],[0,-1,"건물 앞에서 가족과 기념사진을 찍는 사람, 휴대전화로 강의실 위치를 확인하는 사람, 처음 만난 동기와 어색하게 인사를 나누는 사람."],[0,-1,"모두가 각자의 방식으로 스무 살의 시작을 맞이하고 있었다."],[0,-1,"나는 그 풍경을 조금 떨어진 곳에서 바라보았다."],[0,-1,"목에 걸린 구형 DSLR은 걸음을 옮길 때마다 가볍게 흔들렸다. 오래 사용한 카메라였지만 손에 익은 무게와 조작감만큼은 여전히 편안했다. 최신형 장비처럼 화려한 기능을 갖추고 있지는 않았어도, 내가 원하는 장면을 기록하기에는 충분했다."],[0,-1,"나는 카메라를 들어 올렸다."],[0,-1,"뷰파인더 안으로 캠퍼스의 풍경이 들어왔다. 나뭇가지 끝에 매달린 꽃잎은 선명했고, 그 너머를 지나가는 학생들의 모습은 흐릿하게 번졌다."],[0,-1,"초점 링을 조금 돌렸다."],[0,-1,"찰칵."],[0,-1,"셔터 소리가 짧게 울렸다."],[0,-1,"나는 촬영 결과를 확인했다. 노출도 나쁘지 않았고 구도도 안정적이었다. 그럭저럭 만족스러운 사진이었다."],[0,-1,"그런데도 화면을 바라보는 동안 어딘가 부족한 기분이 들었다."],[0,-1,"사진 속에는 벚꽃과 건물, 그 앞을 지나가는 사람들이 있었다. 하지만 그 사람들이 무슨 생각을 하고 있는지, 누구와 함께 이곳에 왔는지, 오늘을 얼마나 기다려왔는지는 알 수 없었다."],[0,-1,"물론 사진 한 장으로 누군가의 모든 것을 알 수는 없다."],[0,-1,"그 사실을 모르는 것은 아니었다."],[0,-1,"그런데도 나는 가끔 사진이 조금 더 많은 것을 담아낼 수 있기를 바랐다. 눈에 보이는 모습뿐만 아니라, 그 순간에만 드러나는 표정과 감정까지."],[0,-1,"문제는 사람을 바라보는 일이 풍경을 바라보는 것보다 훨씬 어렵다는 것이었다."],[0,-1,"풍경은 내가 원하는 구도가 나올 때까지 기다리면 됐다. 나무가 흔들리거나 빛이 달라지면 다시 촬영할 수도 있었다."],[0,-1,"하지만 사람은 달랐다."],[0,-1,"상대에게도 기분이 있었고, 기다려주는 시간에는 한계가 있었다. 카메라를 든 내가 어떤 마음으로 상대를 바라보는지에 따라 사진이 달라질 수도 있었다."],[0,-1,"나는 카메라를 천천히 내렸다."],[0,-1,"오늘은 혼자서 풍경을 찍는 것으로 끝나지 않을 것 같았다."],[0,-1,"약속이 있었기 때문이다."],[0,-1,"나는 손목을 들어 시간을 확인했다. 아직 약속 시간까지는 조금 여유가 있었다. 카메라 스트랩을 고쳐 매고 주변을 둘러보던 순간, 등 뒤에서 익숙한 목소리가 들려왔다."],[1,0,"어이, 이현우! 스무 살 대학생 되신 소감이 어떠신가?"],[0,-1,"등을 가볍게 두드리는 손길과 함께, 익숙한 얼굴이 내 앞에 나타났다."],[0,-1,"나는 카메라를 내리고 녀석을 바라보았다."],[0,-1,"오늘도 시끄러운 하루가 시작될 모양이었다."]]},{"title":"구형 DSLR과 캔커피의 온기","nodes":[[0,-1,"차성재는 내가 대답하기도 전에 낄낄거리며 어깨를 툭 쳤다."],[0,-1,"다른 한 손에는 캔커피가 들려 있었다."],[0,-1,"녀석은 그것을 내 쪽으로 내밀더니, 마치 큰 선심이라도 쓰는 것처럼 어깨를 으쓱했다."],[1,0,"자, 입학 축하 선물이다. 감동해서 눈물이라도 흘리지는 말고."],[1,1,"캔커피 하나 주면서 생색은 엄청 내네."],[1,0,"야, 친구가 주는 선물에 그런 식으로 반응하는 거 아니다. 정성이 중요하지, 정성이."],[1,1,"그 정성, 네가 마시려다가 나한테 준 건 아니고?"],[1,0,"……너 오늘따라 말이 많다?"],[0,-1,"나는 피식 웃으며 캔커피를 받아 들었다."],[0,-1,"손바닥에 전해지는 온기가 기분 좋았다. 카메라를 들고 서 있느라 조금 굳어 있던 손가락도 자연스럽게 풀렸다."],[0,-1,"성재는 내 목에 걸린 DSLR을 발견하고 고개를 갸웃했다."],[1,0,"그런데 넌 입학 첫날부터 카메라냐? 학교 구경도 하기 전에 사진부터 찍고 있네."],[1,1,"기다리는 동안 풍경 좀 찍었어."],[1,0,"풍경은 잘 찍지. 문제는 사람이지."],[0,-1,"나는 캔커피 뚜껑을 열다가 손을 멈췄다."],[1,1,"갑자기 무슨 소리야?"],[1,0,"네가 찍은 풍경 사진은 제법 괜찮은데, 인물 사진만 찍으려고 하면 이상하게 굳어버리잖아. 카메라가 무거워지는 것도 아닌데 왜 그렇게 긴장하는지 모르겠다니까."],[0,-1,"성재는 나를 놀리듯 말했지만, 나는 굳이 반박하지 않았다."],[0,-1,"풍경을 찍는 것과 사람을 찍는 것은 달랐다."],[0,-1,"풍경은 내가 원하는 순간을 기다리면 됐지만, 사람을 촬영할 때는 상대의 시선과 표정까지 신경 쓰였다."],[0,-1,"내가 어색해하면 상대도 어색해하는 것 같았다. 무슨 말을 해야 할지 고민하다 보면 정작 셔터를 눌러야 할 순간을 놓치기도 했다."],[1,1,"그냥 아직 익숙하지 않은 거야."],[1,0,"그러니까 익숙해지려면 사람을 찍어야지. 안 찍으면 계속 못 찍을 거 아니냐?"],[1,1,"그게 마음대로 되나."],[1,0,"마음대로 안 되니까 해보자는 거지. 대학 생활이 괜히 있는 줄 알아? 수업 듣고 과제만 하다가 졸업할 거냐?"],[0,-1,"녀석은 기다렸다는 듯 손가락을 하나 세웠다."],[1,0,"대학 생활의 꽃은 동아리다. 동아리!"],[1,1,"또 그 얘기냐?"],[1,0,"당연하지. 신입생 때 아니면 언제 해보겠냐? 사진 동아리라면 너한테도 나쁘지 않잖아. 카메라 들고 다니는 게 하루 이틀도 아니고."],[1,1,"나도 사진 동아리 갈 거야."],[1,0,"……뭐?"],[1,1,"왜 그렇게 놀라?"],[1,0,"아니, 네 입에서 그런 말이 먼저 나올 줄 몰라서. 사람이 갑자기 달라졌는데?"],[1,1,"별일 없거든."],[1,0,"그런데 왜 갑자기?"],[0,-1,"나는 대답 대신 캔커피를 한 모금 마셨다."],[1,1,"지우랑 약속했어. 입학하면 같이 사진 동아리에 신청하기로."],[1,0,"아, 강지우."],[0,-1,"성재는 그제야 알겠다는 듯 고개를 끄덕였다."],[1,0,"그러면 지금 그 녀석 기다리는 거냐?"],[1,1,"응. 약속 시간보다 조금 일찍 왔거든."],[1,0,"하, 너희 둘은 진짜 한결같다. 대학까지 와서 동아리도 같이 들어가겠다니."],[1,1,"같이 신청하는 게 뭐가 어때서?"],[1,0,"아니, 나쁘다는 게 아니라. 너희 둘이 나란히 카메라 들고 돌아다니는 모습이 상상돼서 그렇지."],[1,1,"쓸데없는 상상 하지 말고 네 할 일이나 해."],[1,0,"알았다, 알았어. 그런데 잘됐네. 나도 사진 동아리 한번 알아보려고 했거든."],[1,1,"너도?"],[1,0,"그래. 네가 들어온다는데 나  이야기를 나누곤 했다."],[0,-1,"지우와 함께했던 어린 시절부터 지금까지, 채아는 자연스럽게 내 일상에 자리 잡고 있었다."],[0,-1,"나는 다시 책상 위의 사진들을 바라보았다."],[0,-1,"시은 누나에게 보여 줄 사진과 채아에게 함께 봐 달라고 할 사진."],[0,-1,"두 사람과의 약속은 서로 다른 모습으로 이어지고 있었다."],[0,-1,"한쪽은 카페 뷰파인더에서 나눈 대화에서 시작되었고, 다른 한쪽은 오래전부터 이어져 온 지우와의 인연 속에서 자연스럽게 이어졌다."],[0,-1,"나는 사진 몇 장을 골라 한쪽에 정리해 두었다."],[0,-1,"사진을 찍고, 정리하고, 누군가와 함께 바라보는 일."],[0,-1,"혼자 카메라를 들고 있을 때는 생각하지 못했던 일들이었다."],[0,-1,"내가 남긴 사진이 다른 사람과의 대화로 이어지고, 그 대화가 또 다른 약속을 만들어 내기도 했다."],[0,-1,"카메라를 가방에 넣으려던 순간, 나는 잠시 손을 멈췄다."],[0,-1,"앞으로도 시은 누나를 찾아갈 일이 있을 테고, 채아와 지우를 만날 일도 있을 것이다."],[0,-1,"특별한 계기가 없어도 자연스럽게 이어지는 만남들."],[0,-1,"그런 일상이 계속된다는 사실이 새삼스럽게 느껴졌다."],[0,-1,"나는 사진을 정리한 뒤 카메라를 가방에 넣었다."],[0,-1,"다음에는 어떤 장면을 담게 될까."],[0,-1,"그리고 그 사진을 누구와 함께 바라보게 될까."],[0,-1,"아직은 알 수 없었다."],[0,-1,"다만 앞으로 이어질 시간 속에서도 지금처럼 여러 사람과 만나고, 함께 웃고, 서로의 이야기를 나누게 될 것이라는 생각이 들었다."],[0,-1,"새로운 이야기는 그렇게 조금씩 시작되고 있었다."]]}],"sub":1},{"id":"ch6","number":6,"title":"비무장지대, 뷰파인더","eps":[{"title":"비무장지대, 뷰파인더","nodes":[[0,-1,"평일 오후."],[0,-1,"수업이 끝난 뒤, 나는 카페 뷰파인더를 찾았다."],[0,-1,"문을 열자 익숙한 종소리가 울렸다."],[0,-1,"커피 향과 오래된 필름 특유의 냄새가 은은하게 섞여 있었다. 창가 쪽에는 몇 명의 손님이 앉아 있었고, 카운터 안쪽에서는 민경훈 사장님이 컵을 정리하고 있었다."],[0,-1,"그 옆에서는 앞치마를 두른 여성이 주문받은 음료를 준비하고 있었다."],[0,-1,"백시은이었다."],[1,10,"어서 오세요. ……어라, 현우 왔네?"],[1,1,"안녕하세요, 시은 누나."],[1,10,"수업 끝났어?"],[1,1,"네. 오늘은 조금 일찍 끝났어요."],[1,10,"잘됐네. 사장님, 현우 왔어요."],[1,12,"왔냐?"],[1,1,"안녕하세요, 사장님."],[1,12,"오늘은 암실 쓰러 온 거냐?"],[1,1,"그것도 있고요. 지난번에 맡겨 둔 필름도 확인하려고요."],[1,12,"잠깐 기다려. 정리해 놓은 게 있으니까."],[0,-1,"사장님은 카운터 아래쪽에서 작은 봉투 하나를 꺼냈다. 봉투에는 내가 맡겼던 필름이 들어 있었다."],[1,10,"이번에도 필름 사진이야?"],[1,1,"네. 학교 주변에서 찍은 것들이에요."],[1,10,"디지털 사진도 좋은데, 필름은 기다리는 재미가 있지."],[1,1,"누나도 사진 찍으세요?"],[1,10,"가끔. 전문적으로 찍는 건 아니고, 그냥 마음에 드는 장면이 있으면 찍는 정도야."],[1,12,"시은이는 손님 없을 때 카메라 만지는 걸 좋아하거든."],[1,10,"사장님, 그렇게 말씀하시면 제가 일 안 하고 노는 사람 같잖아요."],[1,12,"틀린 말은 아니지 않냐?"],[1,10,"정말……."],[0,-1,"시은이는 작게 한숨을 쉬더니 웃으며 다시 카운터 쪽으로 돌아갔다."],[0,-1,"나는 봉투를 받아 들고 안쪽 테이블에 앉았다."],[0,-1,"잠시 뒤, 사장님이 커피 두 잔을 들고 다가왔다. 한 잔은 내 앞에, 다른 한 잔은 맞은편에 내려놓았다."],[1,1,"사장님 것도 가져오신 거예요?"],[1,12,"내가 마실 것도 같이 내린 거지. 네가 신경 쓸 건 아니고."],[0,-1,"사장님은 맞은편 의자에 앉아 내가 들고 있는 필름 봉투를 바라봤다."],[1,12,"이번에는 뭐가 찍혔냐?"],[1,1,"학교 주변에서 찍은 사진들이요. 아직 전부 확인하지는 못했어요."],[1,12,"그럼 천천히 봐. 필름은 디지털 사진처럼 바로 확인할 수 없으니까."],[0,-1,"나는 봉투에서 현상된 사진 몇 장을 꺼냈다."],[0,-1,"학교 건물과 거리 풍경, 벚꽃이 남아 있는 산책로, 그리고 지나가는 사람들의 뒷모습이 담겨 있었다."],[0,-1,"사장님은 사진을 한 장씩 살펴보다가 특정 사진에서 손을 멈췄다."],[1,12,"이건 누구냐?"],[1,1,"지나가던 사람이요. 산책로를 걷고 있길래 풍경이랑 같이 담았어요."],[1,12,"허락은 받았고?"],[1,1,"아뇨. 얼굴이 제대로 나온 사진도 아니고, 그냥 풍경의 일부처럼 찍힌 거라서요."],[0,-1,"사장님은 사진을 다시 내려다봤다."],[1,12,"네 입장에서는 그렇겠지."],[1,1,"다른가요?"],[1,12,"사진을 찍는 사람은 자기가 보고 싶은 장면을 담는다. 하지만 사진에 찍힌 사람은 자기가 어떤 모습으로 남았는지 모를 수도 있어."],[0,-1,"나는 사진을 다시 바라봤다."],[0,-1,"그저 산책로의 분위기를 담기 위해 셔터를 눌렀을 뿐이었다. 사진 속 인물도 특별히 의식하지 않았다."],[0,-1,"하지만 사진을 찍는 사람의 의도와 사진에 담긴 사람의 생각이 반드시 같을 수는 없었다."],[0,-1,"그때 카운터 쪽에서 시은이의 목소리가 들렸다."],[1,10,"사장님 말씀이 맞아요. 찍는 사람은 별생각 없이 찍었어도, 찍힌 사람은 다르게 받아들일 수 있으니까요."],[0,-1,"시은이는 주문을 마친 손님에게 음료를 건네고 우리 쪽으로 다가왔다."],[1,10,"사진 한번 봐도 돼?"],[1,1,"네. 여기요."],[0,-1,"시은이는 사진을 받아 들고 천천히 살펴봤다."],[1,10,"음…… 풍경 자체는 예쁘다. 특히 이 사진은 빛이 잘 들어왔네."],[1,1,"저도 그 사진이 마음에 들어요."],[1,10,"그런데 사람을 풍경의 일부로 생각했는지, 그 사람도 사진에 담기고 싶었는지는 다른 문제겠지."],[1,12,"그렇지. 시은이도 이제 제법 사진에 관해 아는 척을 하는구나."],[1,10,"아는 척이 아니라 저도 손님들 상대하면서 느끼는 게 있는 거예요."],[1,1,"손님들이요?"],[1,10,"응. 카페에 걸린 사진을 보고 좋아하는 사람도 있지만, 자기 모습이 우연히 찍혀 있는 걸 발견하고 불편해하는 사람도 있거든."],[1,12,"그래서 사진을 걸어 둘 때도 신경을 써야 하는 거지."],[0,-1,"시은이는 사진을 다시 테이블 위에 내려놓았다."],[1,10,"현우도 사진을 다른 사람에게 보여 줄 생각이면 한 번 더 생각해 봐. 네가 좋아하는 사진이라고 상대방도 좋아할 거라는 보장은 없으니까."],[1,1,"네. 생각해 볼게요."],[1,10,"좋아. 그럼 난 다시 일하러 갈게. 사장님, 주문 밀리기 전에 돌아오세요."],[1,12,"내 가게에서 내가 어디 가겠냐?"],[1,10,"그러니까요. 제가 바빠지기 전에 도와주셔야죠."],[0,-1,"시은이는 웃으며 카운터로 돌아갔다."],[0,-1,"사장님은 커피를 한 모금 마셨다."],[1,12,"그렇다고 길에서 마주치는 사람마다 허락을 구하라는 얘기는 아니야. 상황마다 다르겠지. 다만 네가 그 사진을 다른 사람에게 보여 주거나 전시하려고 한다면 이야기가 달라질 수 있어."],[1,1,"……그렇겠네요."],[1,12,"네가 예쁘다고 생각한 장면이 다른 사람에게도 예쁘게 느껴질 거라고 생각하지 마라. 그건 사진뿐 아니라 사람을 대할 때도 마찬가지야."],[0,-1,"사장님은 커피를 한 모금 더 마셨다."],[1,12,"뭐든 적당한 거리가 있는 법이거든."],[0,-1,"그때 카운터 쪽에서 목소리가 들렸다."],[1,13,"저기요. 사장님, 잠깐 말씀 좀 드려도 될까요?"],[0,-1,"사장님은 자리에서 일어나 /* ── 캐릭터 입화 ──────────────────────────────────────────────── */
// 화자 이름 → chars/ 폴더의 파일 이름(확장자 제외). 이현우처럼 목록에 없으면 입화를 바꾸지 않음(상대 캐릭터가 그대로 보임)
const SPRITE={'강지우':'kang_jiwoo','윤아린':'yoon_arin','최유나':'choi_yuna','이세라':'lee_sera','한서윤':'han_seoyun','서하린':'seo_harin','백시은':'baek_sieun','강채아':'kang_chaea','차성재':'cha_seongjae'};
// 캐릭터별 위치·크기 조정: x = 가로 위치(%), h = 화면 대비 높이(%). 기본값 x:56, h:92
const CHRSET={};
let curChr=null,chrTO=0;
function setChar(name){
  const id=name?SPRITE[name]:null;
  if(id===curChr)return;curChr=id;
  const im=$('#chr img');clearTimeout(chrTO);im.classList.remove('on');
  if(!id)return;
  const go=()=>{const c=CHRSET[id]||{},p='chars/'+id+'.webp';
    im.style.setProperty('--cx',(c.x??56)+'%');im.style.setProperty('--ch',(c.h??92)+'%');
    im.onerror=()=>im.classList.remove('on');
    if(im.getAttribute('src')===p){im.classList.add('on')}else{im.onload=()=>im.classList.add('on');im.src=p}};
  if(reduce)go();else chrTO=setTimeout(go,180);
}


/* ── 배경음악 ─────────────────────────────────────────────────── */
const BGMF={title:'bgm/bgm_title.mp3',daily:'bgm/bgm_prologue_daily.mp3',reunion:'bgm/bgm_reunion.mp3',cafe:'bgm/bgm_cafe.mp3'};
// 키: 장id_에피소드번호 → 곡. 표에 없는 에피소드는 직전 곡을 이어서 재생
const BGMMAP={prologue_1:'daily',prologue_2:'daily',prologue_3:'daily',prologue_4:'cafe',prologue_5:'reunion',ch4_3:'cafe',ch4_4:'cafe',ch4_5:'cafe'};
let AC=null,MG=null,CH=[],cur=-1,curKey=null,wantKey='title',unlocked=false,bgm={on:true,vol:60};
try{const s=JSON.parse(localStorage.getItem('projectY.bgm'));if(s)bgm={on:s.on!==false,vol:Number.isFinite(s.vol)?s.vol:60}}catch(e){}
function saveBgm(){try{localStorage.setItem('projectY.bgm',JSON.stringify(bgm))}catch(e){}}
function bgmKeyFor(i){for(let j=i;j>=segStart(i);j--){const st=steps[j];if(st.t!=='ep')continue;const k=BGMMAP[st.c.id+'_'+(st.k+1)];if(k)return k}return i>=SUBSTART?null:'title'}
function applyVol(){if(MG)MG.gain.setTargetAtTime(bgm.on?bgm.vol/100:0,AC.currentTime,0.1);$('#bSnd').setAttribute('aria-pressed',bgm.on);$('#vol').value=bgm.vol}
function unlock(){
  if(unlocked)return;
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
  try{
    AC=new Ctx();MG=AC.createGain();MG.connect(AC.destination);
    for(let i=0;i<2;i++){const a=new Audio();a.loop=true;a.preload='auto';const g=AC.createGain();g.gain.value=0;AC.createMediaElementSource(a).connect(g);g.connect(MG);CH.push({a,g})}
    unlocked=true;AC.resume();$('#bSnd2').hidden=true;applyVol();
    CH[1].a.src=BGMF.title;const p=CH[1].a.play();if(p&&p.catch)p.catch(()=>{});   // 모바일에서 두 번째 채널도 사용자 터치로 활성화
    curKey=null;playBgm(wantKey);
    setTimeout(()=>{if(cur!==1)CH[1].a.pause()},2500);
  }catch(e){}
}
function playBgm(key){
  wantKey=key;if(!unlocked||key===curKey)return;curKey=key;
  const t=AC.currentTime,old=CH[cur];
  if(old){old.g.gain.cancelScheduledValues(t);old.g.gain.setValueAtTime(old.g.gain.value,t);old.g.gain.linearRampToValueAtTime(0,t+1.2);setTimeout(()=>{if(CH[cur]!==old)old.a.pause()},1400)}
  const ni=cur===0?1:0,nx=CH[ni];cur=ni;
  nx.a.src=BGMF[key];nx.a.currentTime=0;const p=nx.a.play();if(p&&p.catch)p.catch(()=>{});
  nx.g.gain.cancelScheduledValues(t);nx.g.gain.setValueAtTime(0,t);nx.g.gain.linearRampToValueAtTime(1,t+1.2);
}

const KEY='projectY.common.save';
let S={i:0,n:0,pick:null,play:1,br:null,auto:false,skip:false},T=0,AT=0,typing=false,full='',cardCb=null,log=[];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const show=(id,on=true)=>{$('#'+id).hidden=!on};
const anyOv=()=>!!document.querySelector('.ov:not([hidden]):not(#title)')||!$('#title').hidden;
const lab=c=>c.id==='prologue'?'프롤로그':c.id==='subprologue'?'서브 프롤로그':'제'+c.number+'장';
function save(){try{localStorage.setItem(KEY,JSON.stringify({i:S.i,n:S.n,pick:S.pick,play:S.play,br:S.br}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
const MKEY='projectY.meta';
let meta={clears:0},soonT=0;
try{const m=JSON.parse(localStorage.getItem(MKEY));if(m&&m.clears>0)meta.clears=m.clears|0}catch(e){}
function saveMeta(){try{localStorage.setItem(MKEY,JSON.stringify(meta))}catch(e){}}
function refreshTitle(){$('#bNew').textContent=meta.clears?(meta.clears+1)+'회차 플레이 하기':'처음부터 시작';$('#bCont').hidden=!load()}
function stopTimers(){clearInterval(T);clearTimeout(AT)}
function setMode(k,v){S[k]=v;if(v&&k==='auto')S.skip=false;if(v&&k==='skip')S.auto=false;
  $('#bAuto').setAttribute('aria-pressed',S.auto);$('#bSkip').setAttribute('aria-pressed',S.skip)}

function hideAll(){['card','choice','end','menu','log','title','pick','soon'].forEach(i=>show(i,false))}
function go(i,n=0,br=null){
  stopTimers();S.i=i;S.n=n;S.br=br;save();hideAll();{const k=bgmKeyFor(i);if(k)playBgm(k)}
  const st=steps[i];
  if(st.t==='start'){return card('시작','현우 · 20세','',()=>go(i+1))}
  if(st.t==='router'){FLOW.routePlayPath(S);return go(i+1)}
  if(st.t==='judge'){return FLOW.judgeRelationship(S)?go(i+1):endScreen('진행 조건 미충족','판정 조건이 충족되지 않았어요.')}
  if(st.t==='choice'){return choiceScreen()}
  if(st.t==='soon'){return comingSoon()}
  $('#bar').hidden=false;$('#bPSkip').hidden=!(S.play>1&&i<JUDGE);
  $('#lb').textContent=lab(st.c)+' · '+st.c.title+' — 에피소드 '+(st.k+1)+'/'+st.c.eps.length;
  if(n===0){
    card(lab(st.c)+(st.k===0?' · '+st.c.title:''),st.e.title,'에피소드 '+(st.k+1),()=>{show('card',false);node()});
  }else node();
}
function card(k,t,s,cb){
  setMode('skip',false);stopTimers();show('box',false);setChar(null);
  $('#pskip').hidden=!(S.play>1&&S.i<JUDGE);$('#ck').textContent=k;$('#ct').textContent=t;$('#cs').textContent=s;cardCb=cb;show('card');
}
function node(){
  const st=steps[S.i],nodes=S.br?st.e.br[S.br].n:st.e.nodes;
  if(S.n>=nodes.length){return S.br?comingSoon():go(S.i+1)}
  setBg(bgKeyAt(S.i,S.br?1e9:S.n));
  const [t,sp,tx]=nodes[S.n];
  if(t===4){return showPick(tx)}
  const name=sp>=0?C[sp]:'';
  const b=$('#box');b.hidden=false;b.className=['nar','dlg','msg','sys'][t];
  b.style.setProperty('--tc',COL[name]||'var(--acc)');
  if(t===1&&SPRITE[name])setChar(name);
  $('#nm').hidden=!name;$('#nm').textContent=t===2?name+' · 메시지':name;
  log.push([name,tx]);if(log.length>300)log.shift();
  typeOut(tx);
}
function typeOut(tx){
  stopTimers();full=tx;typing=true;$('#nx').hidden=true;const el=$('#tx');
  if(reduce||S.skip){return done()}
  let k=0;el.textContent='';
  T=setInterval(()=>{k++;el.textContent=tx.slice(0,k);if(k>=tx.length)done()},24);
}
function done(){
  clearInterval(T);typing=false;$('#tx').textContent=full;$('#nx').hidden=false;
  if(S.skip)AT=setTimeout(next,35);else if(S.auto)AT=setTimeout(next,900+full.length*55);
}
function next(){
  if(anyOv())return;
  if(typing){return done()}
  S.n++;save();node();
}
function choiceScreen(){
  $('#bar').hidden=true;show('box',false);setMode('skip',false);setMode('auto',false);
  const g=$('#gr');g.textContent='';
  HEROINES.forEach(h=>{const b=document.createElement('button');b.textContent=h;b.style.setProperty('--tc',COL[h]);
    b.onclick=()=>comingSoon(h);g.appendChild(b)});
  if(S.play>1){const b=document.createElement('button');b.className='wide';b.textContent='서브 히로인 루트';b.onclick=()=>go(SUBSTART);g.appendChild(b)}   // 2회차부터 추가되는 선택지
  show('choice');
}
function showPick(opts){   // 장면 안의 선택지 (서브 피사체 선택)
  stopTimers();setMode('auto',false);setMode('skip',false);
  const pk=$('#pk');pk.textContent='';
  opts.forEach(([key,text])=>{const b=document.createElement('button');b.className='pk';b.textContent=text;
    b.onclick=()=>{show('pick',false);S.br=key;S.n=0;save();node()};pk.appendChild(b)});
  show('pick');
}
function comingSoon(name){
  stopTimers();hideAll();show('box',false);$('#bar').hidden=true;setChar(null);setMode('auto',false);setMode('skip',false);
  if(!name&&S.br){const b=steps[S.i].e.br[S.br];name=b&&b.r}
  if(name)S.pick=name;
  meta.clears=Math.max(meta.clears,S.play);saveMeta();   // 이번 회차 완료 → 다음 회차 해금
  try{localStorage.removeItem(KEY)}catch(e){}
  show('soon');clearTimeout(soonT);soonT=setTimeout(()=>{if(!$('#soon').hidden)toTitle()},4500);
}
function endScreen(t,s){hideAll();$('#et').textContent=t;$('#es').textContent=s;show('end')}
function toTitle(){clearTimeout(soonT);stopTimers();setBg(null);setChar(null);playBgm('title');hideAll();show('box',false);$('#bar').hidden=true;setMode('auto',false);setMode('skip',false);show('title');refreshTitle()}

/* ── 메뉴 / 로그 ──────────────────────────────────────────────── */
function openMenu(){
  stopTimers();const toc=$('#toc');toc.textContent='';let cur='';
  steps.forEach((st,i)=>{if(st.t!=='ep')return;
    if(st.c.id!==cur){cur=st.c.id;const h=document.createElement('h3');h.textContent=lab(st.c)+' · '+st.c.title;toc.appendChild(h)}
    const b=document.createElement('button');b.textContent='에피소드 '+(st.k+1)+'. '+st.e.title;b.onclick=()=>go(i,0);toc.appendChild(b)});
  show('menu');
}
function openLog(){
  stopTimers();const l=$('#lg');l.textContent='';
  log.forEach(([n,t])=>{const p=document.createElement('p');if(n){const b=document.createElement('b');b.textContent=n;p.appendChild(b)}p.appendChild(document.createTextNode(t));l.appendChild(p)});
  show('log');l.scrollTop=l.scrollHeight;
}
function resume(){const m=anyOv();if(!m&&steps[S.i].t==='ep'&&$('#box').hidden===false){if(S.auto||S.skip)done();}}

/* ── 이벤트 ───────────────────────────────────────────────────── */
$('#bNew').onclick=()=>{S.pick=null;S.play=meta.clears+1;log=[];preload();go(0)};
$('#bCont').onclick=()=>{const s=load();if(s){S.pick=s.pick;S.play=s.play||1;log=[];preload();go(s.i,s.n,s.br||null)}};
$('#box').onclick=next;
$('#soon').onclick=toTitle;
$('#bPSkip').onclick=()=>go(JUDGE);
$('#pskip').onclick=e=>{e.stopPropagation();cardCb=null;go(JUDGE)};
$('#card').onclick=()=>{const cb=cardCb;cardCb=null;show('card',false);if(cb)cb()};
$('#bAuto').onclick=()=>{setMode('auto',!S.auto);if(S.auto&&!typing)AT=setTimeout(next,600)};
$('#bSkip').onclick=()=>{setMode('skip',!S.skip);if(S.skip&&!typing)AT=setTimeout(next,35)};
$('#bMenu').onclick=openMenu;$('#bLog').onclick=openLog;
$('#bCloseM').onclick=()=>{show('menu',false);resume()};$('#bCloseL').onclick=()=>{show('log',false);resume()};
$('#bToTitle').onclick=toTitle;$('#bHome').onclick=toTitle;$('#bAgain').onclick=()=>{hideAll();choiceScreen()};
$('#bTheme').onclick=()=>{const r=document.documentElement,o=['auto','light','dark'],c=r.dataset.theme||'auto';r.dataset.theme=o[(o.indexOf(c)+1)%3]};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){$('#menu').hidden?openMenu():show('menu',false);return}
  if(e.key.toLowerCase()==='l'&&!$('#bar').hidden){openLog();return}
  if(e.key===' '||e.key==='Enter'){
    if(e.target.tagName==='BUTTON')return;e.preventDefault();
    if(!$('#card').hidden)$('#card').click();else next();
  }
});
$('#bSnd').onclick=()=>{bgm.on=!bgm.on;saveBgm();applyVol()};
$('#bSnd2').onclick=()=>{bgm.on=true;saveBgm();applyVol()};
$('#vol').oninput=e=>{bgm.vol=+e.target.value;saveBgm();applyVol()};
['click','touchend','keydown'].forEach(ev=>addEventListener(ev,unlock,{capture:true}));
applyVol();
refreshTitle();
</script>
</body>
</html>
