<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리들의 시간 · 공통 루트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;900&display=swap">
<style>
:root{--bg:#e9ecf1;--panel:rgba(250,251,253,.9);--ink:#1b2030;--mute:#5d6578;--line:#aab2c4;--acc:#b8456b;--s1:#d6dded;--s2:#f0dfe8;
--serif:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131b;--panel:rgba(22,26,38,.92);--ink:#e9e6ee;--mute:#9aa1b5;--line:#3a4155;--acc:#e8a3b8;--s1:#182033;--s2:#2b2030}}
:root[data-theme="dark"]{--bg:#10131b;--panel:rgba(22,26,38,.92);--ink:#e9e6ee;--mute:#9aa1b5;--line:#3a4155;--acc:#e8a3b8;--s1:#182033;--s2:#2b2030}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:3px;padding:.45em .9em;cursor:pointer}
button:hover{border-color:var(--acc)}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
#app{position:relative;height:100%;overflow:hidden;background:radial-gradient(circle at 78% 22%,var(--s2),transparent 46%),radial-gradient(circle at 18% 80%,var(--s2),transparent 38%),linear-gradient(160deg,var(--s1),var(--bg))}
.vf i{position:absolute;width:34px;height:34px;border:0 solid var(--acc);opacity:.7;pointer-events:none}
.vf i:nth-child(1){top:16px;left:16px;border-width:2px 0 0 2px}.vf i:nth-child(2){top:16px;right:16px;border-width:2px 2px 0 0}
.vf i:nth-child(3){bottom:16px;left:16px;border-width:0 0 2px 2px}.vf i:nth-child(4){bottom:16px;right:16px;border-width:0 2px 2px 0}
#bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:30px 36px 0;font-size:.85rem;color:var(--mute)}
#bar nav{display:flex;gap:6px;flex-wrap:wrap}#bar button{font-size:.8rem;padding:.3em .7em}
#box{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:min(780px,calc(100% - 56px));min-height:150px;padding:30px 30px 24px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--tc,var(--acc));cursor:pointer;backdrop-filter:blur(6px)}
#nm{position:absolute;top:-17px;left:18px;padding:3px 14px;background:var(--tc,var(--acc));color:#fff;font-size:.88rem;font-weight:700;border-radius:2px}
#tx{margin:0;font-family:var(--serif);font-size:clamp(1rem,2.4vw,1.15rem);line-height:1.95;word-break:keep-all;white-space:pre-wrap}
#box.nar #tx{color:var(--ink)}#box.dlg #tx{font-weight:600}
#box.msg{border-radius:14px;border-left-width:1px;border-left-color:var(--line)}#box.msg #tx{font-family:var(--sans);font-size:1rem}
#box.sys{text-align:center;border-left-width:1px}#box.sys #tx{color:var(--acc);font-weight:600}
#nx{position:absolute;right:16px;bottom:8px;color:var(--acc);animation:b 1.2s infinite}
@keyframes b{50%{transform:translateY(4px)}}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 24px;text-align:center;background:var(--bg)}
.ov[hidden],#box[hidden],#bar[hidden],#nx[hidden]{display:none}
#title{background:transparent}
#title h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(2.6rem,9vw,5rem);letter-spacing:.04em}
#title p,.ov .sub{margin:0;color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{padding:.7em 2em}
#card{cursor:pointer}#card h2{margin:0;font-family:var(--serif);font-size:clamp(1.5rem,5vw,2.4rem);font-weight:600}
#card .k{color:var(--acc);font-size:.95rem}
#card{animation:f .5s}@keyframes f{from{opacity:0}}
#choice h2,#end h2{margin:0;font-family:var(--serif);font-size:clamp(1.3rem,4vw,1.9rem)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(720px,100%)}
.grid button{position:relative;padding:2.2em .5em;font-family:var(--serif);font-size:1.15rem;border-width:2px;background:var(--panel);border-left-color:var(--tc)}
.grid button:hover{border-color:var(--tc);transform:translateY(-2px)}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}#bar{padding:26px 22px 0}}
.list{width:min(560px,100%);max-height:52vh;overflow-y:auto;text-align:left;border:1px solid var(--line);background:var(--panel)}
.list h3{margin:0;padding:10px 14px;font-size:.85rem;color:var(--mute);border-bottom:1px solid var(--line)}
.list button{display:block;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left}
.log p{margin:0 0 10px}.log b{color:var(--acc);margin-right:.6em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <div class="vf"><i></i><i></i><i></i><i></i></div>
 <header id="bar" hidden><span id="lb"></span><nav><button id="bLog">로그</button><button id="bAuto" aria-pressed="false">자동</button><button id="bSkip" aria-pressed="false">스킵</button><button id="bMenu">메뉴</button></nav></header>
 <main id="box" hidden><div id="nm" hidden></div><p id="tx"></p><span id="nx" hidden>▾</span></main>

 <section id="title" class="ov">
  <h1>우리들의 시간</h1><p>메인 히로인 공통 루트 · 프롤로그부터 제5장까지</p>
  <div class="row"><button class="big" id="bNew">처음부터 시작</button><button class="big" id="bCont" hidden>이어하기</button></div>
 </section>
 <section id="card" class="ov" hidden><div class="k" id="ck"></div><h2 id="ct"></h2><div class="sub" id="cs"></div></section>
 <section id="choice" class="ov" hidden><h2>메인 피사체를 선택하세요</h2><p class="sub">오늘 촬영한 여섯 사람 가운데 한 명을 고릅니다.</p><div class="grid" id="gr"></div></section>
 <section id="end" class="ov" hidden><h2 id="et"></h2><p class="sub" id="es"></p><div class="row"><button id="bAgain">다시 선택</button><button id="bHome">제목으로</button></div></section>
 <section id="menu" class="ov" hidden><h2 style="margin:0;font-family:var(--serif)">메뉴</h2>
  <div class="row"><button id="bTheme">화면 테마 바꾸기</button><button id="bToTitle">제목으로</button><button id="bCloseM">닫기</button></div>
  <div class="list" id="toc"></div></section>
 <section id="log" class="ov" hidden><div class="list log" id="lg" style="padding:14px"></div><button id="bCloseL">닫기</button></section>
</div>

<script>
const STORY={"chars":["차성재","이현우","강지우","윤아린","한서윤","이세라","서하린","최유나","교수","학생","백시은","강채아"],"ch":[{"id":"prologue","number":0,"title":"첫 셔터, 흩날리는 봄의 경계","eps":[{"title":"벚꽃이 흩날리는 입학 첫날","nodes":[[0,-1,"사람의 눈은 수많은 장면을 담아낸다."],[0,-1,"누군가의 웃음, 스쳐 지나가는 풍경, 바람에 흔들리는 나뭇잎. 우리는 매 순간 무언가를 바라보며 살아가지만, 시간이 흐른 뒤에도 그때의 모든 모습을 온전히 기억하지는 못한다."],[0,-1,"분명히 보았던 장면인데도 세부적인 부분은 흐릿해지고, 잊고 싶지 않았던 순간조차 어느새 희미한 인상만 남는다. 때로는 실제로 일어났던 일보다 그 순간에 느꼈던 감정이 더 선명하게 기억되기도 한다."],[0,-1,"그래서 나는 카메라를 들었다."],[0,-1,"기록된 찰나는 거짓말을 하지 않으니까."],[0,-1,"적어도, 내 불안한 눈보다는."],[0,-1,"3월 2일."],[0,-1,"새 학기의 시작을 알리는 봄바람이 서운대학교 교정을 가로질렀다. 아직은 조금 쌀쌀한 공기 속에서 벚꽃잎이 흩날렸고, 입학 첫날을 맞이한 학생들은 저마다 새로운 하루를 보내고 있었다."],[0,-1,"건물 앞에서 가족과 기념사진을 찍는 사람, 휴대전화로 강의실 위치를 확인하는 사람, 처음 만난 동기와 어색하게 인사를 나누는 사람."],[0,-1,"모두가 각자의 방식으로 스무 살의 시작을 맞이하고 있었다."],[0,-1,"나는 그 풍경을 조금 떨어진 곳에서 바라보았다."],[0,-1,"목에 걸린 구형 DSLR은 걸음을 옮길 때마다 가볍게 흔들렸다. 오래 사용한 카메라였지만 손에 익은 무게와 조작감만큼은 여전히 편안했다. 최신형 장비처럼 화려한 기능을 갖추고 있지는 않았어도, 내가 원하는 장면을 기록하기에는 충분했다."],[0,-1,"나는 카메라를 들어 올렸다."],[0,-1,"뷰파인더 안으로 캠퍼스의 풍경이 들어왔다. 나뭇가지 끝에 매달린 꽃잎은 선명했고, 그 너머를 지나가는 학생들의 모습은 흐릿하게 번졌다."],[0,-1,"초점 링을 조금 돌렸다."],[0,-1,"찰칵."],[0,-1,"셔터 소리가 짧게 울렸다."],[0,-1,"나는 촬영 결과를 확인했다. 노출도 나쁘지 않았고 구도도 안정적이었다. 그럭저럭 만족스러운 사진이었다."],[0,-1,"그런데도 화면을 바라보는 동안 어딘가 부족한 기분이 들었다."],[0,-1,"사진 속에는 벚꽃과 건물, 그 앞을 지나가는 사람들이 있었다. 하지만 그 사람들이 무슨 생각을 하고 있는지, 누구와 함께 이곳에 왔는지, 오늘을 얼마나 기다려왔는지는 알 수 없었다."],[0,-1,"물론 사진 한 장으로 누군가의 모든 것을 알 수는 없다."],[0,-1,"그 사실을 모르는 것은 아니었다."],[0,-1,"그런데도 나는 가끔 사진이 조금 더 많은 것을 담아낼 수 있기를 바랐다. 눈에 보이는 모습뿐만 아니라, 그 순간에만 드러나는 표정과 감정까지."],[0,-1,"문제는 사람을 바라보는 일이 풍경을 바라보는 것보다 훨씬 어렵다는 것이었다."],[0,-1,"풍경은 내가 원하는 구도가 나올 때까지 기다리면 됐다. 나무가 흔들리거나 빛이 달라지면 다시 촬영할 수도 있었다."],[0,-1,"하지만 사람은 달랐다."],[0,-1,"상대에게도 기분이 있었고, 기다려주는 시간에는 한계가 있었다. 카메라를 든 내가 어떤 마음으로 상대를 바라보는지에 따라 사진이 달라질 수도 있었다."],[0,-1,"나는 카메라를 천천히 내렸다."],[0,-1,"오늘은 혼자서 풍경을 찍는 것으로 끝나지 않을 것 같았다."],[0,-1,"약속이 있었기 때문이다."],[0,-1,"나는 손목을 들어 시간을 확인했다. 아직 약속 시간까지는 조금 여유가 있었다. 카메라 스트랩을 고쳐 매고 주변을 둘러보던 순간, 등 뒤에서 익숙한 목소리가 들려왔다."],[1,0,"어이, 이현우! 스무 살 대학생 되신 소감이 어떠신가?"],[0,-1,"등을 가볍게 두드리는 손길과 함께, 익숙한 얼굴이 내 앞에 나타났다."],[0,-1,"나는 카메라를 내리고 녀석을 바라보았다."],[0,-1,"오늘도 시끄러운 하루가 시작될 모양이었다."]]},{"title":"구형 DSLR과 캔커피의 온기","nodes":[[0,-1,"차성재는 내가 대답하기도 전에 낄낄거리며 어깨를 툭 쳤다."],[0,-1,"다른 한 손에는 캔커피가 들려 있었다."],[0,-1,"녀석은 그것을 내 쪽으로 내밀더니, 마치 큰 선심이라도 쓰는 것처럼 어깨를 으쓱했다."],[1,0,"자, 입학 축하 선물이다. 감동해서 눈물이라도 흘리지는 말고."],[1,1,"캔커피 하나 주면서 생색은 엄청 내네."],[1,0,"야, 친구가 주는 선물에 그런 식으로 반응하는 거 아니다. 정성이 중요하지, 정성이."],[1,1,"그 정성, 네가 마시려다가 나한테 준 건 아니고?"],[1,0,"……너 오늘따라 말이 많다?"],[0,-1,"나는 피식 웃으며 캔커피를 받아 들었다."],[0,-1,"손바닥에 전해지는 온기가 기분 좋았다. 카메라를 들고 서 있느라 조금 굳어 있던 손가락도 자연스럽게 풀렸다."],[0,-1,"성재는 내 목에 걸린 DSLR을 발견하고 고개를 갸웃했다."],[1,0,"그런데 넌 입학 첫날부터 카메라냐? 학교 구경도 하기 전에 사진부터 찍고 있네."],[1,1,"기다리는 동안 풍경 좀 찍었어."],[1,0,"풍경은 잘 찍지. 문제는 사람이지."],[0,-1,"나는 캔커피 뚜껑을 열다가 손을 멈췄다."],[1,1,"갑자기 무슨 소리야?"],[1,0,"네가 찍은 풍경 사진은 제법 괜찮은데, 인물 사진만 찍으려고 하면 이상하게 굳어버리잖아. 카메라가 무거워지는 것도 아닌데 왜 그렇게 긴장하는지 모르겠다니까."],[0,-1,"성재는 나를 놀리듯 말했지만, 나는 굳이 반박하지 않았다."],[0,-1,"풍경을 찍는 것과 사람을 찍는 것은 달랐다."],[0,-1,"풍경은 내가 원하는 순간을 기다리면 됐지만, 사람을 촬영할 때는 상대의 시선과 표정까지 신경 쓰였다."],[0,-1,"내가 어색해하면 상대도 어색해하는 것 같았다. 무슨 말을 해야 할지 고민하다 보면 정작 셔터를 눌러야 할 순간을 놓치기도 했다."],[1,1,"그냥 아직 익숙하지 않은 거야."],[1,0,"그러니까 익숙해지려면 사람을 찍어야지. 안 찍으면 계속 못 찍을 거 아니냐?"],[1,1,"그게 마음대로 되나."],[1,0,"마음대로 안 되니까 해보자는 거지. 대학 생활이 괜히 있는 줄 알아? 수업 듣고 과제만 하다가 졸업할 거냐?"],[0,-1,"녀석은 기다렸다는 듯 손가락을 하나 세웠다."],[1,0,"대학 생활의 꽃은 동아리다. 동아리!"],[1,1,"또 그 얘기냐?"],[1,0,"당연하지. 신입생 때 아니면 언제 해보겠냐? 사진 동아리라면 너한테도 나쁘지 않잖아. 카메라 들고 다니는 게 하루 이틀도 아니고."],[1,1,"나도 사진 동아리 갈 거야."],[1,0,"……뭐?"],[1,1,"왜 그렇게 놀라?"],[1,0,"아니, 네 입에서 그런 말이 먼저 나올 줄 몰라서. 사람이 갑자기 달라졌는데?"],[1,1,"별일 없거든."],[1,0,"그런데 왜 갑자기?"],[0,-1,"나는 대답 대신 캔커피를 한 모금 마셨다."],[1,1,"지우랑 약속했어. 입학하면 같이 사진 동아리에 신청하기로."],[1,0,"아, 강지우."],[0,-1,"성재는 그제야 알겠다는 듯 고개를 끄덕였다."],[1,0,"그러면 지금 그 녀석 기다리는 거냐?"],[1,1,"응. 약속 시간보다 조금 일찍 왔거든."],[1,0,"하, 너희 둘은 진짜 한결같다. 대학까지 와서 동아리도 같이 들어가겠다니."],[1,1,"같이 신청하는 게 뭐가 어때서?"],[1,0,"아니, 나쁘다는 게 아니라. 너희 둘이 나란히 카메라 들고 돌아다니는 모습이 상상돼서 그렇지."],[1,1,"쓸데없는 상상 하지 말고 네 할 일이나 해."],[1,0,"알았다, 알았어. 그런데 잘됐네. 나도 사진 동아리 한번 알아보려고 했거든."],[1,1,"너도?"],[1,0,"그래. 네가 들어온다는데 나까지 빠지면 심심하잖아."],[ function save(){try{localStorage.setItem(KEY,JSON.stringify({i:S.i,n:S.n,pick:S.pick}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function stopTimers(){clearInterval(T);clearTimeout(AT)}
function setMode(k,v){S[k]=v;if(v&&k==='auto')S.skip=false;if(v&&k==='skip')S.auto=false;
  $('#bAuto').setAttribute('aria-pressed',S.auto);$('#bSkip').setAttribute('aria-pressed',S.skip)}

function hideAll(){['card','choice','end','menu','log','title'].forEach(i=>show(i,false))}
function go(i,n=0){
  stopTimers();S.i=i;S.n=n;save();hideAll();
  const st=steps[i];
  if(st.t==='start'){return card('시작','현우 · 20세','',()=>go(i+1))}
  if(st.t==='router'){return FLOW.routePlayPath(S)==='first'?go(i+1):endScreen('아직 정의되지 않은 경로','순서도에 연결된 경로는 초회 플레이뿐이에요.')}
  if(st.t==='judge'){return FLOW.judgeRelationship(S)?go(i+1):endScreen('진행 조건 미충족','판정 조건이 충족되지 않았어요.')}
  if(st.t==='choice'){return choiceScreen()}
  $('#bar').hidden=false;
  $('#lb').textContent=lab(st.c)+' · '+st.c.title+' — 에피소드 '+(st.k+1)+'/'+st.c.eps.length;
  if(n===0){
    card(lab(st.c)+(st.k===0?' · '+st.c.title:''),st.e.title,'에피소드 '+(st.k+1),()=>{show('card',false);node()});
  }else node();
}
function card(k,t,s,cb){
  setMode('skip',false);stopTimers();show('box',false);
  $('#ck').textContent=k;$('#ct').textContent=t;$('#cs').textContent=s;cardCb=cb;show('card');
}
function node(){
  const st=steps[S.i],nodes=st.e.nodes;
  if(S.n>=nodes.length){return go(S.i+1)}
  const [t,sp,tx]=nodes[S.n],name=sp>=0?C[sp]:'';
  const b=$('#box');b.hidden=false;b.className=['nar','dlg','msg','sys'][t];
  b.style.setProperty('--tc',COL[name]||'var(--acc)');
  $('#nm').hidden=!name;$('#nm').textContent=t===2?name+' · 메시지':name;
  log.push([name,tx]);if(log.length>300)log.shift();
  typeOut(tx);
}
function typeOut(tx){
  stopTimers();full=tx;typing=true;$('#nx').hidden=true;const el=$('#tx');
  if(reduce||S.skip){return done()}
  let k=0;el.textContent='';
  T=setInterval(()=>{k++;el.textContent=tx.slice(0,k);if(k>=tx.length)done()},24);
}
function done(){
  clearInterval(T);typing=false;$('#tx').textContent=full;$('#nx').hidden=false;
  if(S.skip)AT=setTimeout(next,35);else if(S.auto)AT=setTimeout(next,900+full.length*55);
}
function next(){
  if(anyOv())return;
  if(typing){return done()}
  S.n++;save();node();
}
function choiceScreen(){
  $('#bar').hidden=true;show('box',false);setMode('skip',false);setMode('auto',false);
  const g=$('#gr');g.textContent='';
  HEROINES.forEach(h=>{const b=document.createElement('button');b.textContent=h;b.style.setProperty('--tc',COL[h]);
    b.onclick=()=>{S.pick=h;save();endScreen('메인 피사체 · '+h,'여기서부터 '+h+' 개별 루트로 이어집니다. 개별 루트 스크립트는 아직 이 파일에 연결되어 있지 않아요.')};g.appendChild(b)});
  show('choice');
}
function endScreen(t,s){hideAll();$('#et').textContent=t;$('#es').textContent=s;show('end')}
function toTitle(){stopTimers();hideAll();show('box',false);$('#bar').hidden=true;setMode('auto',false);setMode('skip',false);show('title');$('#bCont').hidden=!load()}

/* ── 메뉴 / 로그 ──────────────────────────────────────────────── */
function openMenu(){
  stopTimers();const toc=$('#toc');toc.textContent='';let cur='';
  steps.forEach((st,i)=>{if(st.t!=='ep')return;
    if(st.c.id!==cur){cur=st.c.id;const h=document.createElement('h3');h.textContent=lab(st.c)+' · '+st.c.title;toc.appendChild(h)}
    const b=document.createElement('button');b.textContent='에피소드 '+(st.k+1)+'. '+st.e.title;b.onclick=()=>go(i,0);toc.appendChild(b)});
  show('menu');
}
function openLog(){
  stopTimers();const l=$('#lg');l.textContent='';
  log.forEach(([n,t])=>{const p=document.createElement('p');if(n){const b=document.createElement('b');b.textContent=n;p.appendChild(b)}p.appendChild(document.createTextNode(t));l.appendChild(p)});
  show('log');l.scrollTop=l.scrollHeight;
}
function resume(){const m=anyOv();if(!m&&steps[S.i].t==='ep'&&$('#box').hidden===false){if(S.auto||S.skip)done();}}

/* ── 이벤트 ───────────────────────────────────────────────────── */
$('#bNew').onclick=()=>{S.pick=null;log=[];go(0)};
$('#bCont').onclick=()=>{const s=load();if(s){S.pick=s.pick;log=[];go(s.i,s.n)}};
$('#box').onclick=next;
$('#card').onclick=()=>{const cb=cardCb;cardCb=null;show('card',false);if(cb)cb()};
$('#bAuto').onclick=()=>{setMode('auto',!S.auto);if(S.auto&&!typing)AT=setTimeout(next,600)};
$('#bSkip').onclick=()=>{setMode('skip',!S.skip);if(S.skip&&!typing)AT=setTimeout(next,35)};
$('#bMenu').onclick=openMenu;$('#bLog').onclick=openLog;
$('#bCloseM').onclick=()=>{show('menu',false);resume()};$('#bCloseL').onclick=()=>{show('log',false);resume()};
$('#bToTitle').onclick=toTitle;$('#bHome').onclick=toTitle;$('#bAgain').onclick=()=>{hideAll();choiceScreen()};
$('#bTheme').onclick=()=>{const r=document.documentElement,o=['auto','light','dark'],c=r.dataset.theme||'auto';r.dataset.theme=o[(o.indexOf(c)+1)%3]};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){$('#menu').hidden?openMenu():show('menu',false);return}
  if(e.key.toLowerCase()==='l'&&!$('#bar').hidden){openLog();return}
  if(e.key===' '||e.key==='Enter'){
    if(e.target.tagName==='BUTTON')return;e.preventDefault();
    if(!$('#card').hidden)$('#card').click();else next();
  }
});
$('#bCont').hidden=!load();
</script>
</body>
</html>
